<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>Welcome </h1> 

    <!-- Below is the inline JS , here onclick is an event attribute -->
    <button onclick="alert('button is clicked')">
        click here
    </button>
    <br>

    <!-- Below is the internal JS , using the script tag -->
    <script>
        // write method is used to display content but without space
        document.write("I'm in Internal Javascript <br>")
        document.writeln('Hello')
        document.writeln('Students')
        // output : HelloStudents
    </script>

    <!-- Below is the external JS , using the script tag and src attribute -->
    <script src="./Basic.js"></script>
</body>
</html>
