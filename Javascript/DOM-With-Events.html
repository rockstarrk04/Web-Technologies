<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./DOM-With-Events.css">
</head>
<body>
    <h1>DOM With Events</h1>

    <h2>Example 1 : ON-OFF button</h2>

    <h3>Using Event Attribute</h3>

    <button onclick="onOffBtn(event)">
        ON
    </button>

    <h3>Using Event Property</h3>

    <button id="btn2">
        ON
    </button>

    <h3>Using Event Method</h3>

    <button id="btn3">
        ON
    </button>

    <h3>addEventListener Method with event object</h3>

    <button id="btn4">
        ON
    </button>


    <h2>Day-Night Mode</h2>

    <button id="dayNightbtn">
        Day
    </button>

    <h2>Generate OTP</h2>
    <button onclick="generateOTP()" id="GenerateOTP">
        Generate OTP
    </button>






    <script src="./DOM-With-Events.js"></script>
</body>
</html>
